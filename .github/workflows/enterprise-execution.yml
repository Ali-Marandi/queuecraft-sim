name: Enterprise Execution Verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  execution-and-data:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v test_data_plane.py test_data_catalog.py test_execution_plane.py test_enterprise_expansion_v2.py
