name: quality-gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run Python test suite
        run: python -m unittest discover -p 'test_*.py' -v

  javascript-quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Run Node tests
        run: npm test

  governance-contracts:
    runs-on: ubuntu-latest
    needs: python-quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify governance contracts
        run: |
          python -m unittest -v test_governance_hardening.py test_policy_engine.py test_approval_workflow.py test_decision_readiness.py
