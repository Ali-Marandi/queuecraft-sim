name: quality-gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run Python test suite
        run: python -m unittest discover -p 'test_*.py' -v
      - name: Run integrated model governance suite
        run: python -m unittest -v test_model_governance.py test_model_governance_service.py test_model_registry.py test_model_lifecycle.py test_model_lifecycle_service.py test_promotion_gate.py test_walk_forward_backtest.py test_streaming_drift.py test_challenger_orchestrator.py test_continuous_evaluation.py

  javascript-quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Run Node tests
        run: npm test

  governance-contracts:
    runs-on: ubuntu-latest
    needs: python-quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify governance contracts
        run: |
          python -m unittest -v \
            test_governance_hardening.py \
            test_policy_engine.py \
            test_approval_workflow.py \
            test_decision_readiness.py \
            test_enterprise_security.py \
            test_enterprise_extensions.py \
            test_governance_contracts.py \
            test_model_governance.py \
            test_model_governance_service.py
