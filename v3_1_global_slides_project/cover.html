<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    *{box-sizing:border-box;margin:0}
    .slide-container{width:1280px;min-height:720px;background:#071426;color:#eef6ff;font-family:Arial,Helvetica,sans-serif;overflow:hidden}
    .frame{min-height:720px;padding:70px 82px;display:flex;align-items:center;justify-content:space-between;position:relative}
    .eyebrow{font-size:16px;letter-spacing:3px;text-transform:uppercase;color:#74d4ff;font-weight:700;margin-bottom:28px}
    h1{font-size:62px;line-height:1.05;max-width:650px;letter-spacing:-2px}
    .accent{color:#5bd0ff}
    .subtitle{font-size:24px;line-height:1.42;color:#b7c8db;max-width:590px;margin-top:28px}
    .version{display:inline-block;margin-top:38px;padding:10px 16px;border:1px solid rgba(116,212,255,.5);color:#9be1ff;font-size:14px;letter-spacing:1.2px}
    .visual{width:430px;height:430px;position:relative}
    .orb{position:absolute;border:1px solid rgba(91,208,255,.48);border-radius:50%}
    .orb.one{width:410px;height:410px;left:0;top:0}.orb.two{width:295px;height:295px;left:58px;top:58px}.orb.three{width:180px;height:180px;left:116px;top:116px}
    .node{position:absolute;width:20px;height:20px;border-radius:50%;background:#5bd0ff;box-shadow:0 0 28px rgba(91,208,255,.75)}
    .node.a{left:40px;top:188px}.node.b{left:184px;top:64px}.node.c{left:294px;top:215px}.node.d{left:170px;top:338px;background:#f3b640;box-shadow:0 0 28px rgba(243,182,64,.65)}
    .line{position:absolute;height:2px;background:linear-gradient(90deg,transparent,#5bd0ff);transform-origin:left center;opacity:.75}.l1{width:200px;left:50px;top:198px;transform:rotate(-38deg)}.l2{width:160px;left:194px;top:73px;transform:rotate(48deg)}.l3{width:200px;left:178px;top:344px;transform:rotate(-35deg)}
    .footer{position:absolute;bottom:38px;left:82px;font-size:13px;color:#5f7892;letter-spacing:1px}
  </style>
</head>
<body>
  <div class="slide-container">
    <div class="frame">
      <div>
        <div class="eyebrow">Enterprise Queue Intelligence</div>
        <h1>QueueCraft <span class="accent">Enterprise AI</span> v3.1</h1>
        <p class="subtitle">Reliable Data. Transparent Decisions. Global-Ready Queue Operations.</p>
        <div class="version">COMMERCIAL &amp; GLOBAL READINESS UPDATE</div>
      </div>
      <div class="visual" aria-label="Abstract connected queue nodes">
        <div class="orb one"></div><div class="orb two"></div><div class="orb three"></div>
        <div class="line l1"></div><div class="line l2"></div><div class="line l3"></div>
        <div class="node a"></div><div class="node b"></div><div class="node c"></div><div class="node d"></div>
      </div>
      <div class="footer">QUEUECRAFT ENTERPRISE AI · v3.1</div>
    </div>
  </div>
</body>
</html>
